<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova — AI Studio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ---- Light palette (default) ---- */
    :root {
      --bg: #eef5fb;
      --surface: #ffffff;
      --surface-2: #e4eff8;
      --surface-3: #d2e3f1;
      --border: rgba(11, 58, 110, 0.14);
      --text: #0b2d4d;
      --muted: #5b7185;
      --accent-a: #0f5b9a;
      --accent-b: #25a9d6;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.08);
      --shadow: 0 10px 30px -12px rgba(15, 23, 42, 0.15);
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.06);
    }

    /* ---- Dark palette: follows the OS/system's day-night setting automatically ---- */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #071a2d;
        --surface: #0d2944;
        --surface-2: #123958;
        --surface-3: #1b4a6d;
        --border: rgba(255, 255, 255, 0.09);
        --text: #eef1f8;
        --muted: #8b93a7;
        --accent-a: #39a9e0;
        --accent-b: #73d4ec;
        --danger: #f87171;
        --danger-bg: rgba(248, 113, 113, 0.1);
        --shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.6);
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
    }
    /* ---- Explicit override via the theme toggle ---- */
    :root[data-theme="dark"] {
      --bg: #071a2d;
      --surface: #0d2944;
      --surface-2: #123958;
      --surface-3: #1b4a6d;
      --border: rgba(255, 255, 255, 0.09);
      --text: #eef1f8;
      --muted: #8b93a7;
      --accent-a: #39a9e0;
      --accent-b: #73d4ec;
      --danger: #f87171;
      --danger-bg: rgba(248, 113, 113, 0.1);
      --shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.6);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      display: flex;
      height: 100vh;
      overflow: hidden;
      transition: background 0.25s ease, color 0.25s ease;
    }

    /* ---- Sidebar ---- */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 18px;
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 16px;
      margin-bottom: 20px;
      padding: 0 4px;
    }
    .logo-mark {
      width: 180px;
      height: auto;
      display: block;
      flex-shrink: 0;
    }
    #new-chat-btn {
      gap: 8px;
      width: 100%;
      background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
      border: none;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 13.5px;
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
    }
    #new-chat-btn:hover { filter: brightness(1.06); transform: translateY(-1px); }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 1px;
      margin: 0 -6px;
      padding: 0 6px;
    }
    .chat-section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.75;
      padding: 14px 10px 6px;
    }
    .chat-section-label:first-child { padding-top: 4px; }
    .chat-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 9px 8px 9px 13px;
      border-radius: 10px;
      font-size: 13.5px;
      color: var(--muted);
      cursor: pointer;
      position: relative;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .chat-item:hover { background: var(--surface-2); color: var(--text); }
    .chat-item.active {
      background: var(--surface-2);
      color: var(--text);
      font-weight: 600;
      box-shadow: inset 3px 0 0 var(--accent-a);
    }
    .chat-item-title {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-item-delete {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: none;
      color: var(--muted);
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      opacity: 0;
      transition: opacity 0.15s ease, background 0.15s ease, color 0.15s ease;
    }
    .chat-item:hover .chat-item-delete,
    .chat-item:focus-within .chat-item-delete { opacity: 1; }
    .chat-item-delete:hover { background: var(--surface-3); color: var(--danger); }
    @media (hover: none) {
      .chat-item-delete { opacity: 1; }
    }
    .chat-list-empty {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 24px 12px;
      opacity: 0.8;
    }

    /* ---- Main column ---- */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 32px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 12px;
    }
    header h2 {
      font-size: 15px;
      font-weight: 700;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .badge {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      border: 1px solid var(--border);
      background: var(--surface-2);
      padding: 6px 12px;
      border-radius: 20px;
    }
    #theme-toggle {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }
    #theme-toggle:hover { background: var(--surface-3); }

    /* ---- Chat thread ---- */
    .thread {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      max-width: 440px;
      color: var(--muted);
    }
    .empty-state h1 {
      color: var(--text);
      font-size: 26px;
      font-weight: 800;
      margin: 0 0 10px;
    }
    .empty-state p { font-size: 14px; margin: 0 0 20px; }

    .examples {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }
    .example-chip {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--muted);
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .example-chip:hover { color: var(--text); border-color: var(--accent-a); transform: translateY(-1px); }

    .turn { max-width: 660px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; }
    .bubble-user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
      color: #fff;
      border-radius: 16px 16px 4px 16px;
      padding: 12px 16px;
      font-size: 14.5px;
      max-width: 80%;
      margin-left: auto;
      box-shadow: var(--shadow-sm);
    }
    .bubble-assistant {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .model-tag {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .result-image {
      max-width: 420px;
      width: 100%;
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: block;
    }
    .result-actions { display: flex; gap: 14px; align-items: center; }
    .result-actions a, .result-actions button {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--accent-b);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      text-decoration: none;
    }
    .code-block {
      max-width: 100%;
      overflow-x: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      border-radius: 14px;
      padding: 16px 18px;
      margin: 0;
    }
    .code-block code {
      font-family: ui-monospace, 'Cascadia Code', 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
    }
    .error-text {
      color: var(--danger);
      font-size: 13.5px;
      background: var(--danger-bg);
      border: 1px solid var(--danger-bg);
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 420px;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 3px solid var(--border);
      border-top-color: var(--accent-a);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- Composer ---- */
    .composer {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 16px 32px 22px;
      flex-shrink: 0;
    }
    .composer-inner { max-width: 660px; margin: 0 auto; }

    .folder-row {
      display: none;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 12.5px;
      color: var(--muted);
    }
    .folder-row.visible { display: flex; }
    .folder-row button {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--accent-b);
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .folder-row button:hover { background: var(--surface-3); }

    .composer-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    select#model-select {
      flex-shrink: 0;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
      font-size: 13px;
      padding: 12px 10px;
      outline: none;
      cursor: pointer;
    }

    textarea#prompt-input {
      flex: 1;
      resize: none;
      min-height: 46px;
      max-height: 160px;
      padding: 12px 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14.5px;
      line-height: 1.5;
      outline: none;
      transition: border-color 0.2s ease;
    }
    textarea#prompt-input::placeholder { color: var(--muted); }
    textarea#prompt-input:focus { border-color: var(--accent-a); }

    button#gen-btn {
      flex-shrink: 0;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
      color: #fff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: filter 0.2s ease, transform 0.15s ease, background 0.2s ease;
    }
    button#gen-btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
    button#gen-btn.is-stop {
      background: var(--surface-3);
      color: var(--text);
    }
    button#gen-btn.is-stop:hover { filter: none; background: var(--danger-bg); color: var(--danger); }

    .hint {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 10px;
      text-align: center;
    }
    .disclaimer {
      font-size: 11px;
      color: var(--muted);
      opacity: 0.75;
      margin-top: 4px;
      text-align: center;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 8px; }

    /* ---- Confirm modal ---- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-overlay.hidden { display: none; }
    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 320px;
      box-shadow: var(--shadow);
    }
    .modal-box h3 { margin: 0 0 8px; font-size: 16px; }
    .modal-box p { margin: 0 0 20px; font-size: 13.5px; color: var(--muted); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .modal-actions button {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 9px 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }
    #modal-cancel { background: var(--surface-2); color: var(--text); }
    #modal-cancel:hover { background: var(--surface-3); }
    #modal-confirm { background: var(--danger); color: #fff; }
    #modal-confirm:hover { filter: brightness(1.1); }

    @media (max-width: 760px) {
      body { height: 100dvh; }
      .sidebar { width: 220px; padding: 14px; }
      .logo-mark { width: 150px; }
      header { padding: 14px 18px; }
      .header-right { gap: 6px; }
      .badge { display: none; }
      .thread { padding: 20px 16px; gap: 20px; }
      .composer { padding: 12px 14px 16px; }
      .composer-row { flex-wrap: wrap; }
      select#model-select { flex: 1 1 150px; min-width: 0; }
      textarea#prompt-input { flex: 1 1 calc(100% - 58px); min-width: 0; }
      button#gen-btn { margin-left: auto; }
      .modal-box { width: calc(100vw - 32px); }
    }

    @media (max-width: 520px) {
      .sidebar { width: 190px; }
      .logo-mark { width: 130px; }
      header h2 { max-width: 46vw; }
      .thread { padding: 16px 12px; }
      .composer-row { gap: 8px; }
      select#model-select { flex-basis: 100%; }
      textarea#prompt-input { flex-basis: calc(100% - 54px); }
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-header">
      <img id="logo-img" class="logo-mark" src="/assets/logo-1.png" alt="Nova logo">
    </div>
    <button id="new-chat-btn" onclick="createNewChat()">+ New Chat</button>
    <div id="chat-list" class="chat-list"></div>
  </div>

  <div class="main">
    <header>
      <h2 id="chat-title">New chat</h2>
      <div class="header-right">
        <div class="badge">Powered by NVIDIA</div>
        <button id="theme-toggle" onclick="cycleTheme()" title="Toggle theme">🖥️</button>
      </div>
    </header>

    <div id="thread" class="thread"></div>

    <div class="composer">
      <div class="composer-inner">
        <div id="folder-row" class="folder-row">
          <span id="folder-label">📁 No folder selected</span>
          <button id="folder-btn" onclick="handleFolderButtonClick()">Choose folder</button>
        </div>
        <div class="composer-row">
          <select id="model-select"></select>
          <textarea id="prompt-input" rows="1" placeholder="Describe what you want..."></textarea>
          <button id="gen-btn" onclick="handlePrimaryAction()" title="Generate"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg></button>
        </div>
        <p class="hint">Image generation typically takes 5–10 seconds.</p>
        <p class="disclaimer">AI can make mistakes. Check important info.</p>
      </div>
    </div>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-box">
      <h3>Delete this chat?</h3>
      <p>This will permanently delete the conversation and its images. This cannot be undone.</p>
      <div class="modal-actions">
        <button id="modal-cancel" onclick="closeDeleteModal()">Cancel</button>
        <button id="modal-confirm" onclick="confirmDeleteChat()">Delete</button>
      </div>
    </div>
  </div>

  <script>
const EXAMPLE_PROMPTS = [
  'A cat astronaut floating in space',
  'Explain how neural networks learn',
  'Write a function to reverse a linked list',
  'Cozy cabin in a snowy forest'
];

const CODE_EXTENSIONS = {
  python: 'py', py: 'py', javascript: 'js', js: 'js', typescript: 'ts', ts: 'ts',
  bash: 'sh', sh: 'sh', shell: 'sh', json: 'json', html: 'html', css: 'css',
  java: 'java', 'c++': 'cpp', cpp: 'cpp', c: 'c', go: 'go', rust: 'rs',
  ruby: 'rb', php: 'php', sql: 'sql'
};

let currentChatId = null;
let chats = [];
let selectedDirHandle = null;
let projectContext = '';
let folderButtonMode = 'choose'; // 'choose' | 'reconnect'
let reconnectHandle = null; // set when a remembered folder needs a permission re-grant

// ---- Remembering the chosen project folder across reloads ----
// Directory handles can be structured-cloned into IndexedDB, but the *permission*
// granted for one doesn't survive a reload without a user gesture — so on load we
// try a silent permission check, and fall back to a one-click "Reconnect" instead
// of silently forgetting the folder.
const FOLDER_DB_NAME = 'nova-fs-handles';
const FOLDER_STORE_NAME = 'handles';
const FOLDER_HANDLE_KEY = 'projectFolder';

function openFolderDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(FOLDER_DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(FOLDER_STORE_NAME);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveFolderHandle(handle) {
  const db = await openFolderDb();
  await new Promise((resolve, reject) => {
    const tx = db.transaction(FOLDER_STORE_NAME, 'readwrite');
    tx.objectStore(FOLDER_STORE_NAME).put(handle, FOLDER_HANDLE_KEY);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

async function loadFolderHandle() {
  const db = await openFolderDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(FOLDER_STORE_NAME, 'readonly');
    const req = tx.objectStore(FOLDER_STORE_NAME).get(FOLDER_HANDLE_KEY);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

function setFolderButtonMode(mode) {
  folderButtonMode = mode;
  const btn = document.getElementById('folder-btn');
  btn.innerText = mode === 'reconnect' ? 'Reconnect' : 'Choose folder';
}

function handleFolderButtonClick() {
  if (folderButtonMode === 'reconnect') {
    reconnectFolder();
  } else {
    chooseFolder();
  }
}

async function loadFolderContext(handle) {
  const label = document.getElementById('folder-label');
  selectedDirHandle = handle;
  label.innerText = `📁 Reading ${handle.name}...`;

  const { context, fileCount, skipped } = await readProjectFiles(handle);
  projectContext = context;

  const skippedNote = skipped ? ` (${skipped} skipped)` : '';
  label.innerText = fileCount > 0
    ? `📁 ${handle.name} — ${fileCount} files loaded${skippedNote}`
    : `📁 ${handle.name} — no readable source files found`;
  setFolderButtonMode('choose');
}

async function restoreFolder() {
  if (!window.showDirectoryPicker) return;
  try {
    const handle = await loadFolderHandle();
    if (!handle) return;

    const permission = await handle.queryPermission({ mode: 'readwrite' });
    if (permission === 'granted') {
      await loadFolderContext(handle);
    } else {
      reconnectHandle = handle;
      document.getElementById('folder-label').innerText = `📁 ${handle.name} — click Reconnect to resume`;
      setFolderButtonMode('reconnect');
    }
  } catch (error) {
    console.error('Failed to restore remembered folder:', error);
  }
}

async function reconnectFolder() {
  if (!reconnectHandle) return;
  const label = document.getElementById('folder-label');
  try {
    const permission = await reconnectHandle.requestPermission({ mode: 'readwrite' });
    if (permission !== 'granted') {
      label.innerText = '📁 Permission denied — choose a folder to continue';
      return;
    }
    await loadFolderContext(reconnectHandle);
    reconnectHandle = null;
  } catch (error) {
    console.error('Failed to reconnect folder:', error);
    label.innerText = '📁 Could not reconnect — choose a folder to continue';
  }
}

// ---- Reading a project folder as context for Nemotron ----
const IGNORED_DIRS = new Set([
  'node_modules', '.git', 'dist', 'build', '.next', 'out', '__pycache__',
  'venv', '.venv', 'target', 'bin', 'obj', '.cache', 'coverage', '.vscode', '.idea'
]);
const IGNORED_FILES = new Set(['package-lock.json', 'yarn.lock', 'pnpm-lock.yaml']);
const TEXT_EXTENSIONS = new Set([
  'js', 'jsx', 'ts', 'tsx', 'mjs', 'cjs', 'py', 'java', 'c', 'cpp', 'h', 'hpp',
  'cs', 'go', 'rs', 'rb', 'php', 'html', 'htm', 'css', 'scss', 'sass', 'json',
  'md', 'markdown', 'txt', 'yml', 'yaml', 'sh', 'bash', 'sql', 'vue', 'svelte',
  'xml', 'ini', 'toml', 'env'
]);
const MAX_FILE_CHARS = 50_000;
const MAX_TOTAL_CHARS = 120_000;
const MAX_FILES = 200;

async function* walkDirectory(dirHandle, prefix = '') {
  for await (const [name, handle] of dirHandle.entries()) {
    const relPath = prefix ? `${prefix}/${name}` : name;
    if (handle.kind === 'directory') {
      if (IGNORED_DIRS.has(name) || name.startsWith('.')) continue;
      yield* walkDirectory(handle, relPath);
    } else {
      yield { name, relPath, handle };
    }
  }
}

async function readProjectFiles(dirHandle) {
  let totalChars = 0;
  let fileCount = 0;
  let skipped = 0;
  const parts = [];

  for await (const { name, relPath, handle } of walkDirectory(dirHandle)) {
    if (IGNORED_FILES.has(name)) continue;
    const ext = name.includes('.') ? name.split('.').pop().toLowerCase() : '';
    if (!TEXT_EXTENSIONS.has(ext)) continue;

    if (fileCount >= MAX_FILES || totalChars >= MAX_TOTAL_CHARS) {
      skipped++;
      continue;
    }

    try {
      const file = await handle.getFile();
      let text = await file.text();
      if (text.length > MAX_FILE_CHARS) text = text.slice(0, MAX_FILE_CHARS) + '\n...(truncated)';
      if (totalChars + text.length > MAX_TOTAL_CHARS) {
        text = text.slice(0, MAX_TOTAL_CHARS - totalChars) + '\n...(truncated)';
      }
      parts.push(`--- File: ${relPath} ---\n${text}`);
      totalChars += text.length;
      fileCount++;
    } catch (error) {
      skipped++; // unreadable (likely binary or a permission issue) — skip silently
    }
  }

  return { context: parts.join('\n\n'), fileCount, skipped };
}

// ---- Theme: defaults to following the OS's own light/dark (day/night) setting ----
const LOGO_LIGHT_SRC = '/assets/logo-1.png';
const LOGO_DARK_SRC = '/assets/logo-white.png';
const prefersDarkQuery = window.matchMedia('(prefers-color-scheme: dark)');

function updateLogo(theme) {
  const isDark = theme === 'dark' || (theme === 'auto' && prefersDarkQuery.matches);
  document.getElementById('logo-img').src = isDark ? LOGO_DARK_SRC : LOGO_LIGHT_SRC;
}

function applyTheme(theme) {
  const root = document.documentElement;
  const icon = document.getElementById('theme-toggle');
  if (theme === 'auto') {
    root.removeAttribute('data-theme');
    icon.innerText = '🖥️';
    icon.title = 'Theme: Auto (follows system)';
  } else {
    root.setAttribute('data-theme', theme);
    icon.innerText = theme === 'dark' ? '🌙' : '☀️';
    icon.title = `Theme: ${theme === 'dark' ? 'Dark' : 'Light'}`;
  }
  localStorage.setItem('theme', theme);
  updateLogo(theme);
}

function cycleTheme() {
  const current = localStorage.getItem('theme') || 'auto';
  const next = current === 'auto' ? 'light' : current === 'light' ? 'dark' : 'auto';
  applyTheme(next);
}

// Keep the logo in sync if the OS theme changes while "Auto" is active.
prefersDarkQuery.addEventListener('change', () => {
  if ((localStorage.getItem('theme') || 'auto') === 'auto') updateLogo('auto');
});

function escapeHtml(str) {
  const div = document.createElement('div');
  div.innerText = str;
  return div.innerHTML;
}

function useExample(text) {
  const input = document.getElementById('prompt-input');
  input.value = text;
  input.focus();
}

function downloadImage(url) {
  const link = document.createElement('a');
  link.href = url;
  link.download = 'flux-generated-image.png';
  link.click();
}

const messageTexts = {};

function copyText(id, btn) {
  const text = messageTexts[id] || '';
  navigator.clipboard.writeText(text).then(() => {
    const original = btn.innerText;
    btn.innerText = 'Copied!';
    setTimeout(() => { btn.innerText = original; }, 1500);
  });
}

async function chooseFolder() {
  if (!window.showDirectoryPicker) {
    alert('Choosing a folder requires a Chromium-based browser (Chrome or Edge).');
    return;
  }
  const label = document.getElementById('folder-label');
  try {
    const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
    reconnectHandle = null;
    await loadFolderContext(handle);
    saveFolderHandle(handle).catch((error) => console.error('Failed to remember folder:', error));
  } catch (error) {
    if (error.name === 'AbortError') return; // user cancelled the picker, no-op
    console.error('Folder picker failed:', error);
    label.innerText = '📁 No folder selected';
    alert(`Couldn't read that folder: ${error.message}`);
  }
}

function detectFilename(text) {
  const match = text.match(/```(\w+)/);
  const ext = match && CODE_EXTENSIONS[match[1].toLowerCase()] ? CODE_EXTENSIONS[match[1].toLowerCase()] : 'txt';
  return `nemotron-code-${Date.now()}.${ext}`;
}

async function saveToFolder(id, btn) {
  if (!selectedDirHandle) {
    await chooseFolder();
    if (!selectedDirHandle) return;
  }

  const text = messageTexts[id] || '';
  const filename = detectFilename(text);

  try {
    const fileHandle = await selectedDirHandle.getFileHandle(filename, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(text);
    await writable.close();

    const original = btn.innerText;
    btn.innerText = `Saved as ${filename}`;
    setTimeout(() => { btn.innerText = original; }, 2000);
  } catch (error) {
    alert(`Could not save file: ${error.message}`);
  }
}

async function loadModels() {
  const select = document.getElementById('model-select');
  try {
    const response = await fetch('/api/models');
    const models = await response.json();
    const options = ['<option value="auto">Auto</option>', ...models.map(m => `<option value="${m.id}">${m.label}</option>`)];
    select.innerHTML = options.join('');
  } catch (error) {
    console.error('Failed to load models:', error);
    select.innerHTML = '<option value="auto">Auto</option>';
  }
  updateComposerForModel();
}

function updateComposerForModel() {
  const model = document.getElementById('model-select').value;
  const isChat = model === 'nemotron-3-ultra';
  const isAuto = model === 'auto';
  document.getElementById('folder-row').classList.toggle('visible', isChat || isAuto);
  document.querySelector('.hint').innerText = isChat
    ? 'Chat responses can take up to a minute for detailed answers.'
    : isAuto
    ? 'Auto picks the best model for your prompt — image, chat, or code.'
    : 'Image generation typically takes 5–10 seconds.';
  document.getElementById('prompt-input').placeholder = isChat
    ? 'Ask anything, or describe the code you want...'
    : isAuto
    ? 'Describe what you want, or ask anything...'
    : 'Describe what you want...';
}

const CHAT_SECTION_ORDER = ['Today', 'Yesterday', 'Previous 7 Days', 'Previous 30 Days', 'Older'];

function chatSectionFor(updatedAt) {
  const startOfDay = (ms) => { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const diffDays = Math.round((startOfDay(Date.now()) - startOfDay(updatedAt)) / 86_400_000);
  if (diffDays <= 0) return 'Today';
  if (diffDays === 1) return 'Yesterday';
  if (diffDays <= 7) return 'Previous 7 Days';
  if (diffDays <= 30) return 'Previous 30 Days';
  return 'Older';
}

function chatItemHtml(c) {
  return `
    <div class="chat-item ${c.id === currentChatId ? 'active' : ''}" onclick="selectChat(${c.id})">
      <span class="chat-item-title">${escapeHtml(c.title)}</span>
      <button class="chat-item-delete" title="Delete chat" onclick="deleteChat(event, ${c.id})">×</button>
    </div>
  `;
}

function renderChatList() {
  const list = document.getElementById('chat-list');
  if (chats.length === 0) {
    list.innerHTML = '<div class="chat-list-empty">No chats yet</div>';
    return;
  }

  const sections = new Map();
  for (const c of chats) {
    const section = chatSectionFor(c.updated_at);
    if (!sections.has(section)) sections.set(section, []);
    sections.get(section).push(c);
  }

  list.innerHTML = CHAT_SECTION_ORDER
    .filter(section => sections.has(section))
    .map(section => `
      <div class="chat-section-label">${section}</div>
      ${sections.get(section).map(chatItemHtml).join('')}
    `)
    .join('');
}

let chatIdPendingDelete = null;

function deleteChat(event, id) {
  event.stopPropagation();
  chatIdPendingDelete = id;
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeDeleteModal() {
  chatIdPendingDelete = null;
  document.getElementById('modal-overlay').classList.add('hidden');
}

async function confirmDeleteChat() {
  const id = chatIdPendingDelete;
  closeDeleteModal();
  if (!id) return;

  await fetch(`/api/chats/${id}`, { method: 'DELETE' });
  chats = chats.filter(c => c.id !== id);

  if (id !== currentChatId) {
    renderChatList();
  } else if (chats.length > 0) {
    await selectChat(chats[0].id); // also re-renders the list
  } else {
    await createNewChat(); // also re-renders the list
  }
}

async function loadChats() {
  const response = await fetch('/api/chats');
  chats = await response.json();

  if (chats.length === 0) {
    await createNewChat();
    return;
  }

  renderChatList();
  await selectChat(chats[0].id);
}

async function createNewChat() {
  const response = await fetch('/api/chats', { method: 'POST' });
  const chat = await response.json();
  chats.unshift(chat);
  await selectChat(chat.id);
}

async function selectChat(id) {
  currentChatId = id;
  renderChatList();

  const chat = chats.find(c => c.id === id);
  document.getElementById('chat-title').innerText = chat ? chat.title : 'New chat';

  const response = await fetch(`/api/chats/${id}/messages`);
  const messages = await response.json();
  renderThread(messages);
}

function renderThread(messages) {
  const thread = document.getElementById('thread');

  if (messages.length === 0) {
    thread.innerHTML = `
      <div class="empty-state">
        <h1>What can I help with?</h1>
        <p>Ask a question, describe an image, or try one of these:</p>
        <div class="examples">
          ${EXAMPLE_PROMPTS.map(p => `<div class="example-chip" onclick="useExample('${p.replace(/'/g, "\\'")}')">${escapeHtml(p)}</div>`).join('')}
        </div>
      </div>
    `;
    return;
  }

  thread.innerHTML = messages.map(messageHtml).join('');
  thread.scrollTop = thread.scrollHeight;
}

function messageHtml(m) {
  let assistant;
  if (m.image_data) {
    const dataUrl = `data:image/png;base64,${m.image_data}`;
    assistant = `
      <img class="result-image" src="${dataUrl}" alt="Generated image">
      <div class="result-actions">
        <button onclick="downloadImage('${dataUrl}')">Download</button>
      </div>
    `;
  } else if (m.response_text) {
    if (m.id) messageTexts[m.id] = m.response_text;
    assistant = `
      <pre class="code-block"><code>${escapeHtml(m.response_text)}</code></pre>
      <div class="result-actions">
        <button onclick="copyText(${m.id}, this)">Copy</button>
        <button onclick="saveToFolder(${m.id}, this)">Save to Folder</button>
      </div>
    `;
  } else if (m.error) {
    assistant = `<div class="error-text">${escapeHtml(m.error)}</div>`;
  } else {
    assistant = `<div class="spinner"></div>`;
  }

  return `
    <div class="turn">
      <div class="bubble-user">${escapeHtml(m.prompt)}</div>
      <div class="bubble-assistant">
        <span class="model-tag">${escapeHtml(m.model || '')}</span>
        ${assistant}
      </div>
    </div>
  `;
}

const ICON_SEND = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>`;
const ICON_STOP = `<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="3"></rect></svg>`;

let isGenerating = false;
let activeAbortController = null;

function handlePrimaryAction() {
  if (isGenerating) {
    activeAbortController?.abort();
  } else {
    handleGeneration();
  }
}

function setGeneratingState(generating) {
  isGenerating = generating;
  const btn = document.getElementById('gen-btn');
  btn.innerHTML = generating ? ICON_STOP : ICON_SEND;
  btn.classList.toggle('is-stop', generating);
  btn.title = generating ? 'Stop' : 'Generate';
}

async function handleGeneration() {
  const promptInput = document.getElementById('prompt-input');
  const prompt = promptInput.value;
  const selectedModel = document.getElementById('model-select').value;
  const thread = document.getElementById('thread');

  if (isGenerating) return;
  if (!prompt.trim()) return alert('Please enter a prompt!');
  if (!currentChatId) return alert('No active chat.');

  promptInput.value = '';
  setGeneratingState(true);
  activeAbortController = new AbortController();

  // Optimistically render the user's message with a loading indicator.
  const pendingMessage = { prompt, model: selectedModel, image_data: null, error: null };
  const existingEmptyState = thread.querySelector('.empty-state');
  if (existingEmptyState) thread.innerHTML = '';
  thread.insertAdjacentHTML('beforeend', messageHtml(pendingMessage));
  thread.scrollTop = thread.scrollHeight;

  try {
    const response = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prompt,
        model: selectedModel,
        chatId: currentChatId,
        projectContext: (selectedModel === 'nemotron-3-ultra' || selectedModel === 'auto') ? projectContext : ''
      }),
      signal: activeAbortController.signal
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.error || `Status ${response.status}`);

    // Re-render the whole thread from the server so it stays in sync.
    const messagesResponse = await fetch(`/api/chats/${currentChatId}/messages`);
    const messages = await messagesResponse.json();
    renderThread(messages);

    // Refresh the sidebar in case this was the first message (title changed).
    const chatsResponse = await fetch('/api/chats');
    chats = await chatsResponse.json();
    renderChatList();
    const chat = chats.find(c => c.id === currentChatId);
    if (chat) document.getElementById('chat-title').innerText = chat.title;
  } catch (error) {
    const lastAssistant = thread.querySelector('.turn:last-child .bubble-assistant');
    if (error.name === 'AbortError') {
      if (lastAssistant) lastAssistant.innerHTML = `<div class="error-text">Cancelled.</div>`;
    } else {
      console.error(error);
      if (lastAssistant) lastAssistant.innerHTML = `<div class="error-text">${escapeHtml(error.message)}</div>`;
    }
  } finally {
    setGeneratingState(false);
    activeAbortController = null;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  applyTheme(localStorage.getItem('theme') || 'auto');

  loadModels();
  loadChats();
  restoreFolder();

  document.getElementById('model-select').addEventListener('change', updateComposerForModel);

  const input = document.getElementById('prompt-input');
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleGeneration();
    }
  });
});

  </script>
